[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-agent"
version = "0.1.0"
description = "EO-Agent V0.1 offline workflow prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
imagery = [
  "earthengine-api>=1.5,<2",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eo_agent = [
  "reports/templates/*.j2",
  "imagery/templates/*.html",
  "imagery/static/*.js",
  "imagery/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
